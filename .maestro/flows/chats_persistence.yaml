appId: ${APP_ID}
tags: [regression, smoke]
---
- launchApp:
    clearState: true
# AC-6: launch opens a new empty chat with the drawer closed
- extendedWaitUntil:
    visible:
      id: chat_empty_state
    timeout: 20000
- assertVisible:
    id: drawer_menu_btn
- assertNotVisible:
    id: drawer_container
# AC-8: no saved chats yet
- runFlow: ../subflows/open_drawer.yaml
- assertVisible: "No chats yet"
- assertVisible: "Start a conversation and it'll show up here."
- pressKey: back
# AC-1 / AC-13: first message saves the chat and titles it
- runFlow:
    file: ../subflows/send_and_wait.yaml
    env:
      MSG: alpha apples
- tapOn:
    id: chat_new_chat_btn
- runFlow:
    file: ../subflows/send_and_wait.yaml
    env:
      MSG: bravo bananas
- tapOn:
    id: chat_new_chat_btn
- runFlow:
    file: ../subflows/send_and_wait.yaml
    env:
      MSG: charlie cherries
# AC-2: real kill and relaunch (no clearState)
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: chat_empty_state
    timeout: 20000
- runFlow: ../subflows/open_drawer.yaml
- assertVisible: "alpha apples"
- assertVisible: "bravo bananas"
- assertVisible: "charlie cherries"
# AC-2 / AC-9: opening a chat shows its history
- tapOn: "alpha apples"
- extendedWaitUntil:
    visible: "(?s).*You said: alpha apples.*"
    timeout: 10000
- assertNotVisible: "bravo bananas"
